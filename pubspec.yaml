name: piacademy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0' # Updated SDK constraint to be more explicit based on your version

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.0.0 # MOVED: This is a runtime dependency
  provider: ^6.0.5 # Themed changer
  url_launcher: ^6.2.5 # MOVED: This is a runtime dependency
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # MOVED & CORRECTED: Should only be in dev_dependencies. Used your initial version.
  flutter_native_splash: ^2.3.1 # CORRECTED: This is a dev dependency
  flutter_launcher_icons: "^0.13.1"

# === Flutter Native Splash Configuration ===
# This needs to be at the top level, not nested under dependencies
flutter_native_splash:
  color: "#FFFFFF" # Use your app's primary background color here (e.g., #FFFFFF for white, or #000000 for black)
  image: assets/images/appicon.png # Path to your splash screen image (e.g., your app's logo)
  # Recommended: Add a dark mode splash for better UX
  # dark_mode_image: assets/images/app_logo_dark.png
  # dark_mode_color: "#121212" # A dark background color for dark mode splash
  android: true
  ios: true
  # You might want to remove the default Flutter icon during splash
  # android_gravity: center
  # ios_content_mode: center

# === Flutter Launcher Icons Configuration ===
# This also needs to be at the top level
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon.png" # Path to your app's square icon (e.g., for the home screen)
  # Optional: for adaptive icons on Android 8.0+
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tests/RRB/Science/Physics/

  # To add custom fonts to your application, add a fonts section here:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic